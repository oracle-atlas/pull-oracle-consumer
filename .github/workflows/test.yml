name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn check

      - name: Build Standard
        run: forge build --sizes

      - name: Build Advanced
        run: FOUNDRY_PROFILE=advanced forge build --sizes

      - name: Test Standard
        run: forge test -vvv

      - name: Test Advanced
        run: FOUNDRY_PROFILE=advanced forge test -vvv
