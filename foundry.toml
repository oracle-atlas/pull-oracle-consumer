[profile.default]
src = "src"
test = "test/unit"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
solc_version = "0.8.13"

# DEFAULT: Target 'paris' to ensure maximum cross-chain compatibility.
# This prevents the compiler from generating PUSH0 (Shanghai) or TSTORE/MCOPY (Cancun) opcodes,
# allowing the SDK to be deployed on older L2s, sidechains, and private networks.
evm_version = "paris"

# Enable optimizer for better gas efficiency. 
# For best performance, we recommend setting optimizer_runs to at least 10,000 in your foundry.toml.
optimizer = true
optimizer_runs = 10000

# Fuzz Testing: Number of random input scenarios per test function.
fuzz = { runs = 10000 }

[profile.advanced]
src = "src-advanced"
test = "test/advanced"
out = "out-advanced"

solc_version = "0.8.24"
# HIGH-PERFORMANCE: Target 'cancun' for environments supporting EIP-1153.
# This enables advanced opcodes like TSTORE/TLOAD and MCOPY to minimize gas costs 
# on Ethereum Mainnet and major L2s (Arbitrum, Optimism, Base, etc.).
evm_version = "cancun"

# Foundry >= 1.8 defaults unit tests to per-call isolation: each top-level call
# runs as its own transaction, so transient storage is cleared between the two
# mock calls that the cross-call tests (leak / caller-tstore) deliberately rely
# on. The transient suites assume real-chain EIP-1153 semantics — one test = one
# transaction — so isolation must stay off. (Verified: forge 1.5.1 passes,
# forge 1.8.1 fails these two cases with isolation on.)
isolate = false

[profile.examples-standard]
src = "examples/standard"
out = "out"
libs = ["lib"]
solc_version = "0.8.13"
evm_version = "paris"
optimizer = true
optimizer_runs = 10000

[profile.examples-advanced]
src = "examples/advanced"
out = "out-advanced"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
